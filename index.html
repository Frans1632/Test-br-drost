<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="En färgglad liten lekplats med en brödrost och en raket.">
  <title>Tryck & studs!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Ctext x='4' y='25' font-size='24'%3E✦%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">EN LITEN LEKPLATS</span>
      <h1>Tryck <span>&</span> studs!</h1>
      <p>Små saker. Stora upptåg.</p>
    </header>
    <div class="playground">
      <section class="toy toaster-card" aria-labelledby="toast-title">
        <div class="toy-heading"><span class="number">01</span><h2 id="toast-title">Brödhoppet</h2><span aria-hidden="true">✦</span></div>
        <div class="scene toast-scene" id="toast-scene">
          <span class="bread" id="bread" aria-hidden="true">🍞</span>
          <div class="toaster" aria-hidden="true"><div class="slot"></div><span class="face">• ◡ •</span><span class="dial"></span></div>
          <div class="lever-track">
            <button class="lever" id="lever" type="button" aria-label="Dra ned spaken för att rosta brödet. Du kan också klicka eller trycka Enter."></button>
          </div>
          <div class="ground"></div>
        </div>
        <p class="status" id="toast-status" role="status">Redo för ett hopp?</p>
        <p class="instruction">Dra spaken nedåt! <span>Eller klicka på den.</span></p>
      </section>
      <section class="toy rocket-card" aria-labelledby="rocket-title">
        <div class="toy-heading"><span class="number">02</span><h2 id="rocket-title">Mot rymden!</h2><span aria-hidden="true">✧</span></div>
        <div class="scene rocket-scene" id="rocket-scene">
          <span class="star star-one" aria-hidden="true">✦</span><span class="star star-two" aria-hidden="true">✧</span><span class="star star-three" aria-hidden="true">✦</span>
          <div class="rocket" id="rocket" aria-hidden="true">🚀</div>
          <span class="countdown" id="countdown" aria-hidden="true"></span>
          <div class="launch-pad"></div>
        </div>
        <p class="status" id="rocket-status" role="status">Nästa stopp: stjärnorna.</p>
        <button class="launch-button" id="launch" type="button">Starta raketen!</button>
      </section>
    </div>
    <footer>Nyfikenhet är den bästa knappen. <span aria-hidden="true">✦</span></footer>
  </main>
</body>
</html>
